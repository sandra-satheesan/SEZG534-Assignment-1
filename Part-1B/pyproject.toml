[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-reminder-agent"
version = "0.1.0"
description = "Interpret natural-language reminder requests into validated structured data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "PyYAML>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.bandit]
exclude_dirs = ["tests", "eval"]